name: Android Lab
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "game/**"
      - "tools/**"
      - "assets/catalog/**"
      - ".github/workflows/android.yml"
permissions:
  contents: write
  actions: write
concurrency:
  group: android-lab-main
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: "4.4.1"
    steps:
      - uses: actions/checkout@v4
      - name: Acquire and verify CC0 archives
        run: python3 tools/prepare_assets.py
      - name: Retain verified originals in repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/source/cc0
          if ! git diff --cached --quiet; then
            git commit -m "assets: archive verified CC0 Standard packs"
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK and licenses
        shell: bash
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-cli.zip
          unzip -q /tmp/android-cli.zip -d /tmp/android-cli
          mv /tmp/android-cli/cmdline-tools "$SDK/cmdline-tools/latest"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$MANAGER" --sdk_root="$SDK" --licenses
          set -o pipefail
          "$MANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
      - name: Install Godot and export templates
        run: |
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv /tmp/godot-templates/templates "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$JAVA_HOME" "$ANDROID_HOME" "$HOME" > "$HOME/.config/godot/editor_settings-4.4.tres"
      - name: Import real scenes using software OpenGL
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 vulkan-tools
          ICD=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$ICD"
          export VK_ICD_FILENAMES="$ICD"
          export VK_DRIVER_FILES="$ICD"
          unset VK_LAYER_PATH VK_ADD_LAYER_PATH
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
          xvfb-run -a vulkaninfo --summary 2>&1 | tee build/vulkan.log
          xvfb-run -a -s "-screen 0 1280x1024x24" godot --display-driver x11 --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --verbose --path game --editor --import --quit 2>&1 | tee build/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' build/import.log; then exit 1; fi
          test "$(find game/.godot/imported -name '*.scn' | wc -l)" -ge 4
      - name: Smoke test
        shell: bash
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --rendering-method gl_compatibility --audio-driver Dummy --path game --script res://tests/smoke.gd 2>&1 | tee build/smoke.log
          grep -q SMOKE_OK build/smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' build/smoke.log; then exit 1; fi
      - name: Capture actual demonstration frames
        shell: bash
        run: |
          set -o pipefail
          export LAB_CAPTURE_DIR="$PWD/build/demo-screenshots"
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x1024x24" godot --rendering-method gl_compatibility --audio-driver Dummy --resolution 540x960 --path game --script res://tests/capture_demos.gd 2>&1 | tee build/capture.log
          grep -q CAPTURE_OK build/capture.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' build/capture.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lab-demo-screenshots
          path: build/demo-screenshots/
          retention-days: 7
      - name: Resolve versioned APK filename
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          preset = pathlib.Path("game/export_presets.cfg").read_text()
          project = pathlib.Path("game/project.godot").read_text()
          version = re.search(r'^version/name="([0-9A-Za-z.-]+)"$', preset, re.M).group(1)
          assert re.search(r'^config/version="([^"]+)"$', project, re.M).group(1) == version
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"LAB_VERSION={version}\nAPK_NAME=MyGame-Lab-{version}.apk\n")
          PY
      - name: Resolve stable shell fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/shell_fingerprint.py > build/shell-fingerprint.txt
          if gh release view lab-shell-v1 --json assets > build/shell-release.json 2>/dev/null; then
            gh release download lab-shell-v1 --pattern shell-fingerprint.txt --dir /tmp
            cmp /tmp/shell-fingerprint.txt build/shell-fingerprint.txt
            python3 - <<'PY'
          import json
          assets=json.load(open("build/shell-release.json"))["assets"]
          assert any(a["name"].endswith(".apk") and a["size"] > 0 for a in assets)
          PY
            echo "BUILD_SHELL=false" >> "$GITHUB_ENV"
          else
            echo "BUILD_SHELL=true" >> "$GITHUB_ENV"
          fi
      - name: Export and verify content pack
        shell: bash
        run: |
          set -euo pipefail
          printf '{"abi":1,"version":"%s"}\n' "$LAB_VERSION" > game/assets/runtime/content-version.json
          PACK_NAME="MyGame-content-$LAB_VERSION-$GITHUB_RUN_ID.pck"
          echo "PACK_NAME=$PACK_NAME" >> "$GITHUB_ENV"
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --path game --export-pack Android "$PWD/build/$PACK_NAME" 2>&1 | tee build/pack-export.log
          test -s "build/$PACK_NAME"
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' build/pack-export.log; then exit 1; fi
          rm game/assets/runtime/content-version.json
          export XDG_DATA_HOME="$(mktemp -d)"
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --rendering-method gl_compatibility --audio-driver Dummy --path game --script res://tests/pack_boot.gd -- "$PWD/build/$PACK_NAME" 2>&1 | tee build/pack-boot.log
          grep -q PACK_BOOT_OK build/pack-boot.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' build/pack-boot.log; then exit 1; fi
          printf '{"abi":1,"version":"%s"}\n' "$LAB_VERSION" > game/assets/runtime/content-version.json
      - name: Export and verify APK
        if: env.BUILD_SHELL == 'true' || github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --path game --export-debug Android "$PWD/build/$APK_NAME" 2>&1 | tee build/export.log
          test -s "build/$APK_NAME"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "build/$APK_NAME"
          (cd build && sha256sum "$APK_NAME" > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lab-validated-logs
          path: |
            build/*.log
            game/assets/runtime/catalog.json
            game/assets/runtime/items.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success() && github.ref != 'refs/heads/main'
        with:
          name: lab-rebuild-APK
          path: |
            build/*.apk
            build/SHA256SUMS.txt
          retention-days: 1
      - name: Publish stable Android shell
        if: success() && github.ref == 'refs/heads/main' && env.BUILD_SHELL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create lab-shell-v1 "build/$APK_NAME" build/SHA256SUMS.txt build/shell-fingerprint.txt --target "$GITHUB_SHA" --prerelease --title "MyGame Lab Android — Runtime ABI 1" --notes "Install once. Validated content packs are distributed through lab-content-v1. Physical-device validation pending."
          python3 tools/retain_latest_apk.py lab-shell-v1 "$APK_NAME"
      - name: Publish validated content
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view lab-content-v1 >/dev/null 2>&1; then
            gh release create lab-content-v1 --target "$GITHUB_SHA" --prerelease --title "MyGame Lab — Content ABI 1" --notes "Validated, versioned Godot Android PCK packages."
          fi
          gh release upload lab-content-v1 "build/$PACK_NAME"
          python3 tools/retain_content.py "$PACK_NAME"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lab-diagnostics
          path: build/*.log
          if-no-files-found: ignore
