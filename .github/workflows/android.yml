name: Android Lab
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "game/**"
      - "tools/**"
      - "assets/catalog/**"
      - ".github/workflows/android.yml"
permissions:
  contents: write
concurrency:
  group: android-lab-main
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: "4.4.1"
    steps:
      - uses: actions/checkout@v4
      - name: Acquire and verify CC0 archives
        run: python3 tools/prepare_assets.py
      - name: Retain verified originals in repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/source/cc0
          if ! git diff --cached --quiet; then
            git commit -m "assets: archive verified CC0 Standard packs"
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and export templates
        run: |
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv /tmp/godot-templates/templates "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$JAVA_HOME" "$ANDROID_HOME" "$HOME" > "$HOME/.config/godot/editor_settings-4.4.tres"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Import real scenes
        run: godot --headless --path game --editor --import --quit 2>&1 | tee build/import.log
      - name: Smoke test
        run: |
          godot --headless --path game --script res://tests/smoke.gd 2>&1 | tee build/smoke.log
          grep -q SMOKE_OK build/smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' build/smoke.log; then exit 1; fi
      - name: Export and verify APK
        run: |
          godot --headless --path game --export-debug Android "$PWD/build/MyGame-Lab.apk" 2>&1 | tee build/export.log
          test -s build/MyGame-Lab.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify build/MyGame-Lab.apk
          sha256sum build/MyGame-Lab.apk > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MyGame-Lab-Android
          path: |
            build/MyGame-Lab.apk
            build/SHA256SUMS.txt
            build/*.log
            game/assets/runtime/catalog.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lab-diagnostics
          path: build/*.log
          if-no-files-found: ignore
